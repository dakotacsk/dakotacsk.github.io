<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mine & Shine: Animated Portfolio Field</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="kicker">Interactive Art Experiment</p>
      <h1>Mine &amp; Shine: Dreamfield</h1>
      <p class="subtitle">Click tiles to trigger blasts, ripples, and portfolio visions. Less game, more feeling.</p>
      <div class="controls">
        <button id="remix">Remix Field</button>
        <button id="spark">Spark Chain</button>
      </div>
    </header>

    <section class="scene">
      <div class="board-shell">
        <div id="board" class="board" aria-label="Animated minesweeper art board"></div>
      </div>

      <aside class="gallery-shell">
        <h2>Live Discoveries</h2>
        <p>Each opening drops a visual memory card from your portfolio universe.</p>
        <div id="gallery" class="gallery"></div>
      </aside>
    </section>

    <section class="meters">
      <div class="meter"><span>Energy</span><strong id="energy">0</strong></div>
      <div class="meter"><span>Explosions</span><strong id="explosions">0</strong></div>
      <div class="meter"><span>Mood</span><strong id="mood">Dreamy</strong></div>
    </section>
  </main>

  <template id="card-template">
    <article class="card">
      <img alt="Portfolio discovery" />
      <div>
        <h3></h3>
        <p></p>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
